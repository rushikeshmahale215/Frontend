<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    body{
      background-color:rgb(206, 223, 244);
    }
    .box{
      margin:170px;
    
      border-radius: 20px;
      height: 60vh;
      margin-left: auto;
      margin-right: auto;
      
      width: 220px;
      background-color:white;
    }
    .image{
      align-items:center;
      border-radius: 20px;
      padding: 10px;
    

    }
    .p1{
      text-align: center;
      margin-top: 5px;
      font-size: medium;
      padding-left: 20px;
      padding-right: 20px;
      
      font-weight: bold;
    }
    .desc{
      font-size: small;
      text-align: center;
      margin-top: 5px;
      padding-left: 18px;
      padding-right: 18px;
    }
  </style>
</head>
<body>
   
   <div class = "box">
    
      <img class="image" src="images/image-qr-code.png" height="auto" width="200px" />
      <p class="p1">Improve your front-end skills by building projects</p>
      <p class="desc">Scan the QR code to visit Frontend Mentor and take your coding skills to next level.</p>
    
   </div>
  
</body>
</html>
