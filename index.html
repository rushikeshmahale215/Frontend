<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  
  <style>
    body{
      background-color: rgb(241, 218, 100);
    }
    .box{
      background-color: white;
      width:40vh;
      height: 400px;
      border-radius: 10px;
      margin: auto;
      margin-top: 150px;
      align-items: center;
      box-shadow: 8px 8px 0px 0px #000000;
      border: 1px solid;
    }
    .image{
      width:220px;
      margin: 15px;
      border-radius: 10px;
    }
    .learn{
      background-color: rgb(241, 218, 100);
      height: auto;
      width: 70px;
      border-radius: 5px;
      margin: 20px;
      margin-top: 5px;
      padding: 5px;
      font-weight: bold;
    }
    .publish{
      margin: 18px;
      font-size: smaller;
      
    }
    .desc{
      margin: 18px;
      font-size: smaller;
      color: rgb(94, 95, 95);
      
    }

    .img2{
      margin: 9px;
      height: 23px;
      border-radius: 50%;
      width: 23px;
      
    }
    .greg{
      display: flex;
      align-items: center;
      margin: 9px;
      gap: 5px;
      flex-direction: row;

    }
  </style>
</head>
<body>


  <div class="box">
    <img class="image" src="assets/images/illustration-article.svg"/>
    <p class="learn">Learning</p>
    <p class="publish">Published 21 Dec 2023</p>
    <h3 class="publish">HTML & CSS foundations</h3>
    <p class="desc">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    <div class="greg">
      <img src="assets/images/image-avatar.webp" class="img2"/>
      <span style="font-weight: bold;font-size: smaller;margin: 9px;">Greg Hooper</span>
      
    </div>

  </div>
<!-- 
  Learning

  Published 21 Dec 2023

  HTML & CSS foundations

  These languages are the backbone of every website, defining structure, content, and presentation.

  Greg Hooper -->
  
  
</body>
</html>
